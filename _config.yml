title: "niksetty.exe"
description: "Cybersecurity writeups and learning portfolio by Nimshasri."
url: "https://niksetty.xyz"
baseurl: ""
markdown: kramdown
permalink: pretty
collections:
  writeups:
    output: true
    permalink: /writeups/:name/
  notes:
    output: true
    permalink: /notes/:name/
  achievements:
    output: true
    permalink: /achievements/:name/
  events:
    output: true
    permalink: /events/:name/
defaults:
  - scope: {path: "", type: writeups}
    values: {layout: article, kind: Writeup}
  - scope: {path: "", type: notes}
    values: {layout: article, kind: Note}
  - scope: {path: "", type: achievements}
    values: {layout: article, kind: Achievement}
  - scope: {path: "", type: events}
    values: {layout: article, kind: Event}
exclude: [README.md, SETUP.md, Gemfile, Gemfile.lock, vendor]
