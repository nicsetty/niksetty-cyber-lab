
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="color-scheme" content="light">

  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <title>
    {% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}
  </title>

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="icon" type="image/gif" sizes="32x32" href="{{ '/assets/favicon.gif' | relative_url }}">

  <!-- Website Stylesheet -->
  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >
</head>

<body>

  {% include header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script
    src="{{ '/assets/js/site.js' | relative_url }}"
    defer
  ></script>

</body>
</html>
